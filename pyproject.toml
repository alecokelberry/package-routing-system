[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "package-routing-system"
version = "1.0.0"
description = "Same-day package router with a hand-written chaining hash table and a nearest-neighbor route."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alec Okelberry" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.10", "mypy==2.4.0", "pytest==9.1.1"]

[tool.setuptools]
packages = ["routing"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["routing", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
